# Learn more about configuring your Customer account UI extension:
# https://shopify.dev/api/customer-account-ui-extensions/unstable/configuration

api_version = "2026-01"

[[extensions]]
name = "My Referrals"
handle = "referral-page"
type = "ui_extension"
uid = "5309806e-21c0-b4ef-3492-769295e2858fa6a52c65"

[[extensions.targeting]]
module = "./src/ReferralPage.jsx"
target = "customer-account.page.render"

[extensions.capabilities]
api_access = true
network_access = true

[extensions.settings]

  [[extensions.settings.fields]]
  key = "app_url"
  type = "single_line_text_field"
  name = "App URL"
  description = "The app backend URL (set automatically in dev, configure for production)"
